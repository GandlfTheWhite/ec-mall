name: Verify and Deploy Frontend

on:
  push:
    branches: [dev, master]
    paths:
      - 'ec-mall-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    branches: [dev, master]
    paths:
      - 'ec-mall-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ec-mall-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ec-mall-frontend
      - name: Test
        run: npm test
        working-directory: ec-mall-frontend
      - name: Build
        run: npm run build
        working-directory: ec-mall-frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ec-mall-frontend/dist
          if-no-files-found: error

  deploy:
    needs: verify
    # リポジトリ変数を明示的に有効化するまでは本番配信を停止する。
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Sync files to S3
        shell: bash
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 sync ./dist "s3://$S3_BUCKET" --delete --exclude "index.html"
          aws s3 cp ./dist/index.html "s3://$S3_BUCKET/index.html" --content-type "text/html" --cache-control "public, max-age=0, must-revalidate"
      - name: Invalidate CloudFront
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
