name: Deploy Frontend to S3 and CloudFront

on:
  push:
    branches:
      - master
    paths:
      - 'ec-mall-frontend/**'  # 只有前端代码变化时才触发，请根据你的实际目录修改

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'ec-mall-frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./ec-mall-frontend

      - name: Build
        run: npm run build
        working-directory: ./ec-mall-frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync files to S3
        run: |
          aws s3 sync ./ec-mall-frontend/dist s3://${{ secrets.S3_BUCKET }} --delete --exclude "index.html"
          aws s3 cp ./ec-mall-frontend/dist/index.html s3://${{ secrets.S3_BUCKET }}/index.html --content-type "text/html" --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"