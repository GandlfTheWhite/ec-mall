# ローカルでのみ --spring.profiles.active=local を指定して使用する。
server:
  port: ${LOCAL_PORT:8888}

spring:
  datasource:
    url: jdbc:mysql://192.168.56.11:3306/ec_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

jwt:
  # 32バイト以上の鍵をBase64にした値を、ローカル環境変数で設定する。
  secret: ${JWT_SECRET}
