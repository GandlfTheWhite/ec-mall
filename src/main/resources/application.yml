server:
  port: ${PORT:5000}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  profiles:
    # 指定なしでは本番設定を使い、ローカルDBには接続しない。
    default: prod
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  images:
    enabled: ${IMAGE_UPLOAD_ENABLED:false}
    bucket: ${IMAGE_BUCKET:}
    region: ${IMAGE_REGION:}
    public-base-url: ${IMAGE_PUBLIC_BASE_URL:}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

mybatis:
  configuration:
    map-underscore-to-camel-case: true
