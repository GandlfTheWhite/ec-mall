# AWS EB の環境プロパティで設定する。ホスト・認証情報に既定値を設けない。
spring:
  datasource:
    url: jdbc:mysql://${RDS_HOSTNAME}:${RDS_PORT:3306}/${RDS_DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
